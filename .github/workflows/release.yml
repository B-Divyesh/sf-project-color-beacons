name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    env:
      APPLE_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux libraries
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Require Windows code-signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)
          if (-not $hasCertificate -or -not $hasPassword) {
            throw 'WINDOWS_CERT_PFX and WINDOWS_CERT_PASSWORD are required for a public release.'
          }
      - name: Require Apple signing and notarization credentials
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          test "${{ env.APPLE_SIGNING_CONFIGURED }}" = 'true' || {
            printf '%s\n' 'Apple signing and notarization credentials are required for a public release.' >&2
            exit 1
          }
      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'project-color-beacons.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if (-not $config.bundle.windows) { $config.bundle | Add-Member -MemberType NoteProperty -Name windows -Value ([pscustomobject]@{}) }
          $config.bundle.windows | Add-Member -Force -MemberType NoteProperty -Name certificateThumbprint -Value $certificate.Thumbprint
          $config.bundle.windows | Add-Member -Force -MemberType NoteProperty -Name digestAlgorithm -Value 'sha256'
          $config.bundle.windows | Add-Member -Force -MemberType NoteProperty -Name timestampUrl -Value 'http://timestamp.digicert.com'
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath
          Remove-Item $pfxPath
      - name: Build Windows or Linux package
        if: matrix.platform != 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Project Color Beacons ${{ github.ref_name }}
          releaseBody: |
            Verified desktop release.

            Windows installers have a verified Windows signature. macOS packages are signed and notarized. GitHub records which repository, workflow, commit, and tag produced each package.

            Windows signature check: passed. macOS signing check: passed. macOS notarization check: passed.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
      - name: Build signed and notarized macOS package
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Project Color Beacons ${{ github.ref_name }}
          releaseBody: |
            Verified desktop release.

            Windows installers have a verified Windows signature. macOS packages are signed and notarized. GitHub records which repository, workflow, commit, and tag produced each package.

            Windows signature check: passed. macOS signing check: passed. macOS notarization check: passed.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
      - name: Verify Windows installer signature
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'src-tauri/target' -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer was produced.' }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Windows signature verification failed: $($signature.Status)" }
          @{ platform = 'windows'; asset = $installer.Name; authenticodeVerified = $true } | ConvertTo-Json | Set-Content 'platform-signature-x86_64-pc-windows-msvc.json'
      - name: Verify macOS signing and notarization
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          disk_images=()
          while IFS= read -r disk_image; do disk_images+=("$disk_image"); done < <(find src-tauri/target -name '*.dmg' -type f)
          test "${#disk_images[@]}" -gt 0
          for disk_image in "${disk_images[@]}"; do
            assessment="$(spctl --assess --type open --context context:primary-signature --verbose "$disk_image" 2>&1)"
            printf '%s\n' "$assessment"
            printf '%s' "$assessment" | grep -Eq 'Notarized Developer ID|source=Notarized Developer ID'
          done
          node -e 'const fs=require("fs"); const names=process.argv.slice(1); fs.writeFileSync("platform-signature-${{ matrix.target }}.json", JSON.stringify({platform:"macOS",assets:names,codeSigned:true,notarized:true},null,2));' "${disk_images[@]##*/}"
      - name: Upload platform signature report
        if: matrix.platform == 'windows-latest' || matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: platform-signature-${{ matrix.target }}
          path: platform-signature-*.json
          if-no-files-found: error

  finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdir release-assets && gh release download "${GITHUB_REF_NAME}" --dir release-assets
      - name: Download platform signature reports
        uses: actions/download-artifact@v4
        with:
          pattern: platform-signature-*
          path: signature-reports
          merge-multiple: true
      - name: Build checksums and download manifest
        run: node scripts/make-release-manifest.mjs release-assets "${GITHUB_REF_NAME}"
      - name: Sign package provenance with the release workflow identity
        id: provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Add the portable Sigstore bundle
        run: cp "${{ steps.provenance.outputs.bundle-path }}" release-assets/BUILD-PROVENANCE.sigstore.json
      - name: Record verified platform signatures
        run: node scripts/make-platform-signature-record.mjs release-assets signature-reports "${GITHUB_REF_NAME}"
      - name: Upload verified metadata and publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: |
            release-assets/SHA256SUMS
            release-assets/latest.json
            release-assets/BUILD-PROVENANCE.sigstore.json
            release-assets/platform-signatures.json
