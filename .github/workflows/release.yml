name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux libraries
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Import optional Windows signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'Configure both WINDOWS_CERT_PFX and WINDOWS_CERT_PASSWORD, or neither.'
          }
          if (-not $hasCertificate) { Write-Output 'No Windows platform certificate configured; GitHub provenance will sign the candidate source identity.'; exit 0 }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'project-color-beacons.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $password = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if (-not $config.bundle.windows) { $config.bundle | Add-Member -MemberType NoteProperty -Name windows -Value ([pscustomobject]@{}) }
          $config.bundle.windows | Add-Member -Force -MemberType NoteProperty -Name certificateThumbprint -Value $certificate.Thumbprint
          $config.bundle.windows | Add-Member -Force -MemberType NoteProperty -Name digestAlgorithm -Value 'sha256'
          $config.bundle.windows | Add-Member -Force -MemberType NoteProperty -Name timestampUrl -Value 'http://timestamp.digicert.com'
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath
          Remove-Item $pfxPath
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Project Color Beacons ${{ github.ref_name }}
          releaseBody: |
            Source-signed desktop candidate. GitHub build provenance ties every package to this repository, workflow, commit, and tag.

            Verify a downloaded package with `gh attestation verify <file> --repo B-Divyesh/sf-project-color-beacons`, then compare SHA256SUMS. The macOS and Windows packages are not notarized or trust-store signed unless their optional repository credentials were configured for this run.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdir release-assets && gh release download "${GITHUB_REF_NAME}" --dir release-assets
      - name: Build checksums and download manifest
        run: node scripts/make-release-manifest.mjs release-assets "${GITHUB_REF_NAME}"
      - name: Sign package provenance with the release workflow identity
        id: provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Add the portable Sigstore bundle
        run: cp "${{ steps.provenance.outputs.bundle-path }}" release-assets/BUILD-PROVENANCE.sigstore.json
      - name: Upload signed metadata and publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: |
            release-assets/SHA256SUMS
            release-assets/latest.json
            release-assets/BUILD-PROVENANCE.sigstore.json
