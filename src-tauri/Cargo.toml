[package]
name = "project-color-beacons"
version = "0.1.4"
description = "Local project identity beacons for developers"
authors = ["Param Factory"]
edition = "2021"
license = "MIT"

[lib]
name = "project_color_beacons_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "project-color-beacons"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
